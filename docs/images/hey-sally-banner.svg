<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Hey Sally</title>
  <desc id="d">A phone listening for the wake phrase Hey Sally, with sound waves and music notes, beside four goals: hands-free voice wake, works with the screen off, private by design, and plays what you ask.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14084f"/>
      <stop offset="0.42" stop-color="#4b1d96"/>
      <stop offset="0.78" stop-color="#d1307a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="1" stop-color="#ff80ab"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="0.5" stop-color="#ff4081"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1170"/>
      <stop offset="1" stop-color="#7a1f6e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff80ab" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff80ab" stop-opacity="0"/>
    </radialGradient>
    <g id="note">
      <ellipse cx="0" cy="0" rx="11" ry="8" transform="rotate(-20)"/>
      <rect x="8" y="-38" width="3.6" height="38"/>
      <path d="M11.6 -38 C26 -34 28 -22 23 -14 C22 -22 17 -26 11.6 -26 Z"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="990" cy="360" r="330" fill="url(#glow)"/>
  <circle cx="90" cy="600" r="150" fill="#4dd0e1" opacity="0.10"/>
  <circle cx="620" cy="60" r="90" fill="#ffd54f" opacity="0.10"/>

  <!-- voice rings -->
  <g fill="none" stroke="url(#ring)" stroke-width="3">
    <circle cx="990" cy="360" r="200" opacity="0.50"/>
    <circle cx="990" cy="360" r="265" opacity="0.32"/>
    <circle cx="990" cy="360" r="330" opacity="0.18"/>
  </g>

  <!-- floating notes -->
  <g fill="#ffd54f"><use href="#note" transform="translate(770 200) scale(1.5)"/></g>
  <g fill="#4dd0e1"><use href="#note" transform="translate(1190 345) scale(1.4)"/></g>
  <g fill="#ff80ab"><use href="#note" transform="translate(790 520) scale(1.3)"/></g>
  <g fill="#ffe082"><use href="#note" transform="translate(1175 540) scale(1.1)"/></g>

  <!-- phone -->
  <g transform="translate(990 360)">
    <rect x="-118" y="-232" width="236" height="464" rx="40" fill="#0d0830" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
    <rect x="-104" y="-218" width="208" height="436" rx="30" fill="url(#screen)"/>
    <rect x="-24" y="-208" width="48" height="10" rx="5" fill="#0d0830"/>
    <text x="0" y="-130" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Hey Sally</text>
    <g fill="url(#bar)">
      <rect x="-86" y="-20" width="12" height="40" rx="6"/>
      <rect x="-66" y="-40" width="12" height="80" rx="6"/>
      <rect x="-46" y="-65" width="12" height="130" rx="6"/>
      <rect x="-26" y="-45" width="12" height="90" rx="6"/>
      <rect x="-6" y="-85" width="12" height="170" rx="6"/>
      <rect x="14" y="-50" width="12" height="100" rx="6"/>
      <rect x="34" y="-70" width="12" height="140" rx="6"/>
      <rect x="54" y="-35" width="12" height="70" rx="6"/>
      <rect x="74" y="-18" width="12" height="36" rx="6"/>
    </g>
    <text x="0" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.85">listening…</text>
    <rect x="-34" y="188" width="68" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="1000" y="34" width="250" height="86" rx="22" fill="#ffffff"/>
    <path d="M1040 118 L1052 146 L1074 118 Z" fill="#ffffff"/>
    <text x="1125" y="70" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#4b1d96">“Hey Sally…”</text>
    <text x="1125" y="102" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#d1307a">play my Daily Mix</text>
  </g>

  <!-- headline and goals -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="66" y="165" font-size="118" font-weight="800" fill="url(#title)">Hey Sally</text>
    <text x="70" y="218" font-size="33" fill="#ffffff" fill-opacity="0.92">Hands-free voice control for Spotify</text>

    <rect x="70" y="232" width="192" height="32" rx="16" fill="#ffffff"/>
    <text x="166" y="254" text-anchor="middle" font-size="18" font-weight="700" fill="#4b1d96">Spotify only, for now</text>
    <text x="276" y="254" font-size="18" fill="#fff" fill-opacity="0.85">YouTube Music, Deezer and others not supported yet</text>

    <g transform="translate(95 306)">
      <circle r="24" fill="#ff4081"/>
      <rect x="-5" y="-14" width="10" height="19" rx="5" fill="#fff"/>
      <path d="M-10 0 A10 10 0 0 0 10 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M0 10 V15 M-6 15 H6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <text x="140" y="312" font-size="27" font-weight="700" fill="#fff">Just say it</text>
    <text x="140" y="340" font-size="20" fill="#fff" fill-opacity="0.85">Wake with “Hey Sally”. No tapping, no touching.</text>

    <g transform="translate(95 381)">
      <circle r="24" fill="#7c4dff"/>
      <path d="M5 -13 A13 13 0 1 0 13 5 A10 10 0 0 1 5 -13 Z" fill="#fff"/>
    </g>
    <text x="140" y="387" font-size="27" font-weight="700" fill="#fff">Built for the screen off</text>
    <text x="140" y="415" font-size="20" fill="#fff" fill-opacity="0.85">Locked phone, in the car, hands busy.</text>

    <g transform="translate(95 456)">
      <circle r="24" fill="#00bfa5"/>
      <path d="M0 -14 L12 -9 V0 C12 8 6 13 0 16 C-6 13 -12 8 -12 0 V-9 Z" fill="#fff"/>
      <path d="M-5 1 L-1 5 L6 -4" fill="none" stroke="#00bfa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="140" y="462" font-size="27" font-weight="700" fill="#fff">Private by design</text>
    <text x="140" y="490" font-size="20" fill="#fff" fill-opacity="0.85">Offline wake word. The app saves no audio or words.</text>

    <g transform="translate(95 531)">
      <circle r="24" fill="#ff9100"/>
      <g fill="#fff" transform="translate(-6 8) scale(0.8)">
        <ellipse cx="0" cy="0" rx="11" ry="8" transform="rotate(-20)"/>
        <rect x="8" y="-38" width="3.6" height="38"/>
        <path d="M11.6 -38 C26 -34 28 -22 23 -14 C22 -22 17 -26 11.6 -26 Z"/>
      </g>
    </g>
    <text x="140" y="537" font-size="27" font-weight="700" fill="#fff">Plays what you ask</text>
    <text x="140" y="565" font-size="20" fill="#fff" fill-opacity="0.85">Songs, artists, playlists, Daily Mix and radio on Spotify.</text>

    <text x="70" y="618" font-size="16" fill="#fff" fill-opacity="0.7">Android · Pixel · Open source (MIT) · Independent project, not affiliated with Spotify</text>
  </g>
</svg>
